[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-template-builder"
version = "0.1.0"
description = "面向 Agent 可用数据的模板构建器和导出流水线。"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "Pillow>=10.0",
]

[project.scripts]
agent-template-builder-analyze = "agent_template_builder.pipeline.analyze:main"
agent-template-builder-analyze-screenshots = "agent_template_builder.pipeline.analyze_screenshots:main"
agent-template-builder-export-agent-rows = "agent_template_builder.pipeline.export_agent_rows:main"
agent-template-builder-audit-templates = "agent_template_builder.tools.audit_templates:main"
agent-template-builder-template-coverage = "agent_template_builder.tools.report_template_coverage:main"
agent-template-builder-recognition-quality = "agent_template_builder.tools.report_recognition_quality:main"
agent-template-builder-ocr-smoke-test = "agent_template_builder.tools.ocr_smoke_test:main"
agent-template-builder-prepare-discovery = "agent_template_builder.pipeline.prepare_discovery:main"
agent-template-builder-finalize-discovery = "agent_template_builder.pipeline.finalize_discovery:main"
agent-template-builder-apply-discovery-review = "agent_template_builder.pipeline.apply_discovery_review:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pydantic>=2.0,<3",
]
discovery = [
  "pydantic>=2.0,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
